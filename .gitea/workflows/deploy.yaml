name: Localhost PM2 Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: local-host
    steps:
      - name: Checkout local repository code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build Next.js site
        run: npm run build

      - name: Sync Build to Stable Location and Reload PM2
        run: |
          # 1. Define your stable local folder path
          TARGET_DIR="/Users/cybyrynth/Research-and-Development-Center/extended-spaces"

          # 2. Sync the raw build assets and dependency updates to your main folder
          rsync -av --delete .next/ "$TARGET_DIR/.next/"
          rsync -av package.json "$TARGET_DIR/"

          # 3. Check if PM2 is actively running from the stable directory path
          if pm2 list | grep -q "extended-spaces"; then
            echo "App exists, reloading production server..."
            PORT=4040 pm2 reload extended-spaces --update-env
          else
            echo "First time setup, starting application from stable path..."
            PORT=4040 pm2 start npm --name "extended-spaces" --cwd "$TARGET_DIR" -- run start
          fi
          pm2 save
